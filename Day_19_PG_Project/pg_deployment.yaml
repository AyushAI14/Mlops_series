apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgkbs
spec:
  selector:
    matchLabels:
      app: pgkbs
  template:
    metadata:
      labels:
        app: pgkbs
    spec:
      containers:
      - name: pgkbs
        image: pgkbs:latest
        imagePullPolicy: Never
        resources:
          limits:
            memory: "64Mi"
            cpu: "200m"
        ports:
        - containerPort: 5000

--- 
apiVersion: v1
kind: Service
metadata:
  name: pgkbs
spec:
  selector:
    app: pgkbs
  ports:
  - port: 8080
    targetPort: 5000

